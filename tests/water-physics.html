<!doctype html>
<meta charset="utf-8">
<title>Water physics regression</title>
<pre id="output">Running GPU physics regressions…</pre>
<script type="module">
import { WaterCompute } from '../src/water/compute.ts';
import { makeGrid, C2, SIM_SPEED, SIGMA, W, H } from '../src/types.ts';
import { Rain } from '../src/scene/rain.ts';
const output = document.querySelector('#output');
window.physicsResult = (async () => {
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error('WebGPU unavailable');
  const device = await adapter.requestDevice();
  const errors = [];
  device.addEventListener('uncapturederror', e => errors.push(e.error.message));
  const results = [];
  const assert = (ok, message) => { if (!ok) throw new Error(message); };
  async function readState(sim, source = sim.currentStateBuffer) {
    const buffer = device.createBuffer({size: source.size, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ});
    const encoder = device.createCommandEncoder();
    encoder.copyBufferToBuffer(source, 0, buffer, 0, buffer.size);
    device.queue.submit([encoder.finish()]);
    await buffer.mapAsync(GPUMapMode.READ);
    const data = new Float32Array(buffer.getMappedRange()).slice();
    buffer.unmap(); buffer.destroy();
    return data;
  }
  function meanHeight(data, g, level = 1) {
    let sum = 0;
    for (let z = 0; z < g.NZ; z++) for (let x = 0; x < g.NX; x++) {
      const weight = (x === 0 || x === g.NX-1 ? 0.5 : 1)
                   * (z === 0 || z === g.NZ-1 ? 0.5 : 1);
      sum += weight * data[2*(z*g.NX+x)+level];
    }
    return sum / ((g.NX-1)*(g.NZ-1));
  }
  function advance(sim, dt, clicks = []) {
    const encoder = device.createCommandEncoder();
    sim.simulate(encoder, dt, clicks);
    device.queue.submit([encoder.finish()]);
  }
  function addCurrent(sim, x, z) {
    const encoder = device.createCommandEncoder();
    sim.flow.addImpulse(encoder, x, z, 100, 40, SIGMA / sim.rippleSize);
    device.queue.submit([encoder.finish()]);
  }
  try {
    const grid = makeGrid(60);
    const snapshots = [];
    for (const fps of [30, 60, 144]) {
      const sim = new WaterCompute(device, grid);
      sim.injectGaussian(0, 0, -8, 0.005);
      advance(sim, 0, [{x: -20, z: 0, strength: 1}]);
      addCurrent(sim, -20, 0);
      for (let i = 0; i < fps; i++) advance(sim, 1000 / fps);
      snapshots.push(await readState(sim));
      snapshots.push(await readState(sim, sim.flow.velocityBuffer));
      sim.dispose();
    }
    let maxDifference = 0;
    for (let frame = 1; frame < 3; frame++) for (let field = 0; field < 2; field++) {
      const reference = snapshots[field], data = snapshots[frame * 2 + field];
      for (let i = 0; i < data.length; i++) maxDifference = Math.max(maxDifference, Math.abs(data[i] - reference[i]));
    }
    assert(maxDifference < 1e-5, `Frame partition changed the solution: ${maxDifference}`);
    results.push({name: '30/60/144 Hz equal-time flow and surface evolution', maxDifference});

    // A cosine is an exact eigenmode of the mirrored-wall discrete Laplacian.
    // Its phase checks dispersion, boundary reflection and the time integrator together.
    for (const mode of [2, 10]) {
      const sim = new WaterCompute(device, grid);
      sim.damping = 0;
      const initial = new Float32Array(grid.NUM_VERTS * 2);
      for (let z = 0; z < grid.NZ; z++) for (let x = 0; x < grid.NX; x++) {
        const h = Math.cos(mode * Math.PI * x / (grid.NX - 1));
        initial[(z * grid.NX + x) * 2] = h;
        initial[(z * grid.NX + x) * 2 + 1] = h;
      }
      device.queue.writeBuffer(sim.currentStateBuffer, 0, initial);
      const lambda = 4 * Math.sin(mode * Math.PI / (2 * (grid.NX - 1))) ** 2 / grid.DELTA_X2;
      const omega2 = C2 * lambda * (1 + 9 * lambda);
      for (let i = 0; i < 60; i++) advance(sim, 1000 / 60);
      const dt = sim.paramsArray[0];
      const steps = Math.floor((1000 * SIM_SPEED + 1e-6) / dt);
      let prev = 1, cur = 1;
      for (let i = 0; i < steps; i++) [prev, cur] = [cur, 2 * cur - prev - omega2 * dt * dt * cur];
      const data = await readState(sim);
      let error = 0;
      for (let i = 0; i < grid.NUM_VERTS; i++) error = Math.max(error, Math.abs(data[2*i+1] - initial[2*i+1] * cur));
      assert(error < 0.002, `Mode ${mode} phase/wall error: ${error}`);
      results.push({name: `Dispersive reflecting mode ${mode}`, error, phaseSpeed: Math.sqrt(omega2 / lambda)});
      sim.dispose();
    }

    // Projection must remove compressive motion, including impulses at a wall.
    for (const x of [0, W/2]) {
      const sim = new WaterCompute(device, grid);
      const {nx, nz} = sim.flow;
      function divergence(data) {
        const at = (x, z, k) => {
          const i = Math.min(nz-1, Math.max(0,z))*nx + Math.min(nx-1, Math.max(0,x));
          const reflected = k === 0 ? x < 0 || x >= nx : z < 0 || z >= nz;
          return data[2*i+k] * (reflected ? -1 : 1);
        };
        let sum = 0;
        for (let z = 0; z < nz; z++) for (let x = 0; x < nx; x++) {
          const div = (at(x+1,z,0)-at(x-1,z,0))/(2*W/nx)
                    + (at(x,z+1,1)-at(x,z-1,1))/(2*H/nz);
          sum += div*div;
        }
        return Math.sqrt(sum/(nx*nz));
      }
      addCurrent(sim, x, 0);
      const before = divergence(await readState(sim, sim.flow.velocityBuffer));
      sim.flow.prepare(1/120);
      const encoder = device.createCommandEncoder(), pass = encoder.beginComputePass();
      sim.flow.step(pass); pass.end(); device.queue.submit([encoder.finish()]);
      const velocity = await readState(sim, sim.flow.velocityBuffer);
      const after = divergence(velocity);
      assert(before > 0.1 && after < before * 0.4, `Projection failed at x=${x}: ${before} -> ${after}`);
      assert(velocity.every(Number.isFinite), 'Flow produced non-finite velocity');
      sim.zeroState();
      assert((await readState(sim, sim.flow.velocityBuffer)).every(v => v === 0), 'Reset retained currents');
      results.push({name: `Pressure projection and reset at x=${x}`, before, after});
      sim.dispose();
    }

    // Isolate transport: a constant interior current must move both height time
    // levels by v*dt, without introducing vertical momentum.
    {
      const sim = new WaterCompute(device, grid);
      sim.injectGaussian(-30, 0, 1, 0.002);
      const velocity = new Float32Array(sim.flow.nx * sim.flow.nz * 2);
      for (let i = 0; i < velocity.length; i += 2) velocity[i] = 100;
      device.queue.writeBuffer(sim.flow.velocityBuffer, 0, velocity);
      sim.flow.prepare(0.1);
      const encoder = device.createCommandEncoder(), pass = encoder.beginComputePass();
      sim.flow.advectSurface(pass, 0, sim.workgroupX, sim.workgroupZ);
      pass.end(); device.queue.submit([encoder.finish()]);
      const data = await readState(sim, sim.stateB);
      let sum = 0, moment = 0, momentumError = 0;
      for (let z = 0; z < grid.NZ; z++) for (let x = 0; x < grid.NX; x++) {
        const i = 2*(z*grid.NX+x), h = data[i+1];
        sum += h; moment += h*(-W/2+x*grid.DELTA_X);
        momentumError = Math.max(momentumError, Math.abs(data[i]-h));
      }
      const center = moment/sum;
      assert(Math.abs(center - (-20)) < 0.05, `Current failed to carry surface: center=${center}`);
      assert(momentumError === 0, `Transport injected vertical momentum: ${momentumError}`);
      results.push({name: 'Surface carried by current with consistent time levels', center, momentumError});
      sim.dispose();
    }
    const sim = new WaterCompute(device, makeGrid(450));
    sim.waveSpeed = 2; sim.damping = 0;
    const initial = new Float32Array(sim.grid.NUM_VERTS * 2);
    for (let i = 0; i < sim.grid.NUM_VERTS; i++) {
      const h = ((i % sim.grid.NX + Math.floor(i / sim.grid.NX)) % 2) ? 1 : -1;
      initial[2*i] = initial[2*i+1] = h;
    }
    device.queue.writeBuffer(sim.currentStateBuffer, 0, initial);
    for (let i = 0; i < 10; i++) advance(sim, 100);
    const data = await readState(sim);
    const peak = data.reduce((max, h) => Math.max(max, Math.abs(h)), 0);
    assert(Number.isFinite(peak) && peak < 2, `Finest-grid Nyquist instability: ${peak}`);
    results.push({name: 'Finest grid, maximum speed, undamped Nyquist stability', peak});
    sim.zeroState();
    advance(sim, 0, [{x: 145, z: 0, strength: 1}]);
    const clicked = await readState(sim);
    assert(clicked.some(h => h > 1), 'Zero-step frame lost wall click');
    assert(clicked.every((h, i) => i % 2 || h === clicked[i+1]), 'Click injected velocity');
    results.push({name: 'Wall click survives a frame without a physics step'});
    sim.dispose();

    // Preserve per-sample strength through batch growth and later smaller batches.
    {
      const sim = new WaterCompute(device, grid);
      sim.rippleAmplitude = 3;
      for (const count of [3, 65, 2]) {
        const clicks = Array.from({length: count}, (_, i) => ({
          x: -100 + 200 * i / (count - 1), z: (i % 3 - 1) * 70,
          strength: i === 0 ? 1 : (i % 4) / 12,
        }));
        // Superposition of separate full-strength splashes is the batch contract,
        // independent of the chosen conservative splash profile.
        const expected = new Float64Array(grid.NUM_VERTS * 2);
        for (const click of clicks) {
          sim.zeroState();
          advance(sim, 0, [{...click, strength: 1}]);
          const single = await readState(sim);
          for (let i = 0; i < single.length; i++) expected[i] += click.strength * single[i];
        }
        sim.zeroState();
        advance(sim, 0, clicks);
        const data = await readState(sim);
        let error = 0;
        for (let i = 0; i < data.length; i++) error = Math.max(error, Math.abs(data[i]-expected[i]));
        assert(error < 0.002, `Drag batch ${count} lost or changed a splash: ${error}`);
        assert((await readState(sim, sim.flow.velocityBuffer)).every(v => v === 0), 'Ripple drag injected a sideways current');
        results.push({name: `Weighted ripple batch of ${count}`, error});
      }
      sim.dispose();
    }

    // Interior, each wall, each corner, and off-grid near-wall deposits must
    // preserve a nonzero level and existing vertical velocity, not recenter it.
    const sites = [-W/2, 0, W/2].flatMap(x => [-H/2, 0, H/2].map(z => ({x, z})));
    sites.push({x: -W/2+0.7, z: H/2-1.2}, {x: W/2-0.7, z: 13.1});
    for (const [rows, size] of [[60, 0.3], [60, 3], [450, 0.3], [450, 3]]) {
      const sim = new WaterCompute(device, makeGrid(rows)), g = sim.grid;
      sim.rippleAmplitude = 80; sim.rippleSize = size;
      const initial = new Float32Array(g.NUM_VERTS * 2);
      for (let i = 0; i < initial.length; i += 2) { initial[i] = 2.75; initial[i+1] = 3; }
      device.queue.writeBuffer(sim.currentStateBuffer, 0, initial);
      for (const site of sites) {
        advance(sim, 0, [{...site, strength: 1}]);
        const data = await readState(sim);
        assert(Math.abs(meanHeight(data, g)-3) < 0.00005,
          `Pointer changed level at (${site.x}, ${site.z}), rows=${rows}, size=${size}`);
      }
      const drag = sites.map(site => ({...site, strength: 1/12}));
      for (let i = 0; i < 32; i++) advance(sim, 0, drag);
      const data = await readState(sim);
      const mean = meanHeight(data, g), previousMean = meanHeight(data, g, 0);
      let min = Infinity, max = -Infinity, velocityError = 0;
      for (let i = 0; i < data.length; i += 2) {
        min = Math.min(min, data[i+1]); max = Math.max(max, data[i+1]);
        velocityError = Math.max(velocityError, Math.abs(data[i+1]-data[i]-0.25));
      }
      assert(Math.abs(mean-3) < 0.00005 && Math.abs(previousMean-2.75) < 0.00005,
        `Repeated dragging changed the water level: ${previousMean}, ${mean}`);
      assert(min < 2 && max > 4, 'Pointer must raise water and create a compensating trough');
      assert(velocityError < 0.0002, `Pointer changed existing vertical velocity: ${velocityError}`);
      results.push({name: `Pointer volume conservation: rows=${rows}, size=${size}`, mean, previousMean, velocityError});
      sim.dispose();
    }

    // Exercise forcing and actual wave evolution together over a sustained drag.
    {
      const sim = new WaterCompute(device, grid);
      sim.rippleAmplitude = 80; sim.rippleSize = 3;
      device.queue.writeBuffer(sim.currentStateBuffer, 0, new Float32Array(grid.NUM_VERTS * 2).fill(3));
      for (let frame = 0; frame < 240; frame++) {
        const t = frame / 239;
        advance(sim, 1000/60, [{x: -W/2+W*t, z: (H/2-1)*Math.sin(t*4*Math.PI), strength: 1/12}]);
      }
      const data = await readState(sim), mean = meanHeight(data, grid);
      assert(data.every(Number.isFinite), 'Sustained dragging produced non-finite heights');
      assert(Math.abs(mean-3) < 0.002, `Drag plus wave evolution changed the mean water level: ${mean}`);
      results.push({name: 'Four seconds of dragging with wave evolution', mean});
      sim.dispose();
    }

    // Real rain updates, with repeatable random spawning. No simulation-wide
    // recentering: impacts must preserve even an initially nonzero water level.
    for (const [rows, size] of [[60, 4], [60, 16], [450, 16]]) {
      const sim = new WaterCompute(device, makeGrid(rows)), g = sim.grid;
      const initial = new Float32Array(g.NUM_VERTS * 2).fill(3);
      device.queue.writeBuffer(sim.currentStateBuffer, 0, initial);
      const originalRandom = Math.random;
      let seed = 123456789;
      Math.random = () => {
        seed = (Math.imul(1664525, seed) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      try {
        const rain = new Rain(device, 'bgra8unorm', 'depth24plus');
        rain.strength = 5; rain.size = size; rain.variety = 1;
        const vp = new Float32Array(16);
        for (let frame = 0; frame < 120; frame++) {
          const encoder = device.createCommandEncoder();
          rain.update(encoder, 50, sim.currentStateBuffer, g, vp, 1);
          device.queue.submit([encoder.finish()]);
        }
      } finally { Math.random = originalRandom; }
      const data = await readState(sim);
      let sum = 0, min = Infinity, max = -Infinity, timeLevelError = 0;
      for (let z = 0; z < g.NZ; z++) for (let x = 0; x < g.NX; x++) {
        const i = 2*(z*g.NX+x), h = data[i+1];
        // Boundary vertices cover half a cell per adjacent wall.
        const weight = (x === 0 || x === g.NX-1 ? 0.5 : 1)
                     * (z === 0 || z === g.NZ-1 ? 0.5 : 1);
        sum += weight*h;
        min = Math.min(min, h); max = Math.max(max, h);
        timeLevelError = Math.max(timeLevelError, Math.abs(h-data[i]));
      }
      const mean = sum / ((g.NX-1)*(g.NZ-1));
      assert(Math.abs(mean-3) < 0.00005, `Rain changed mean level (${rows}, ${size}): ${mean}`);
      assert(min < 2 && max > 4, 'Rain must create depressions and compensating raised water');
      assert(timeLevelError === 0, 'Rain injected net vertical momentum');
      results.push({name: `Six seconds of varied rain: rows=${rows}, size=${size}`, mean, min, max});
      sim.dispose();
    }
    await device.queue.onSubmittedWorkDone();
    assert(errors.length === 0, errors.join('\n'));
    output.textContent = JSON.stringify({passed: true, results}, null, 2);
    return {passed: true, results};
  } finally { device.destroy(); }
})().catch(error => { output.textContent = error.stack; return {passed: false, error: error.message}; });
</script>
