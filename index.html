<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waterwave WebGPU Experiment</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; }
      
      #controls {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(10px);
        border-radius: 8px;
        padding: 20px;
        color: white;
        min-width: 280px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      
      #controls h2 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        color: #fff;
      }
      
      .control-group {
        margin-bottom: 20px;
      }
      
      .control-group:last-child {
        margin-bottom: 0;
      }
      
      .control-group label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        color: #ccc;
      }
      
      .control-group select,
      .control-group input[type="range"] {
        width: 100%;
      }
      
      .control-group select {
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        color: white;
        font-size: 13px;
        cursor: pointer;
      }
      
      .control-group select:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      
      .control-group select:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.4);
      }
      
      .control-group option {
        background: #1a1a1a;
        color: white;
      }
      
      .slider-container {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      
      .slider-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .slider-value {
        font-size: 13px;
        color: #fff;
        font-weight: 500;
      }
      
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        outline: none;
      }
      
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        background: white;
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.15s;
      }
      
      input[type="range"]::-webkit-slider-thumb:hover {
        background: #f0f0f0;
      }
      
      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: white;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.15s;
      }
      
      input[type="range"]::-moz-range-thumb:hover {
        background: #f0f0f0;
      }
      
      #loading-panel {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 30px 40px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 1000;
        min-width: 280px;
      }
      
      #loading-panel.visible {
        display: flex;
      }
      
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      .loading-text {
        color: #fff;
        font-size: 16px;
        font-weight: 500;
        text-align: center;
      }
      
      .loading-subtext {
        color: #aaa;
        font-size: 13px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="gpu-canvas"></canvas>
    
    <div id="controls">
      <h2>Scene Controls</h2>
      
      <div class="control-group">
        <label for="skybox-select">Background Environment</label>
        <select id="skybox-select">
          <option value="citrus_orchard_puresky_4k.exr">Citrus Orchard</option>
          <option value="qwantani_sunset_puresky_4k.exr">Qwantani Sunset</option>
          <option value="qwantani_dusk_2_puresky_4k.exr">Qwantani Dusk</option>
        </select>
      </div>
      
      <div class="control-group">
        <label for="resolution-select" title="Higher = smoother waves but more GPU work. Changing this rebuilds and resets the water.">Water Resolution</label>
        <select id="resolution-select" title="Higher = smoother waves but more GPU work. Changing this rebuilds and resets the water.">
          <option value="ultralow">Ultra Low</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high" selected>High</option>
          <option value="veryhigh">Very High</option>
        </select>
      </div>
      
      <div class="control-group">
        <div class="slider-container">
          <div class="slider-header">
            <label for="sky-intensity">Sky Brightness</label>
            <span class="slider-value" id="sky-intensity-value">1.0</span>
          </div>
          <input type="range" id="sky-intensity" min="0" max="3" step="0.1" value="1.0">
        </div>
      </div>
      
      <div class="control-group">
        <div class="slider-container">
          <div class="slider-header">
            <label for="wave-speed">Wave Speed</label>
            <span class="slider-value" id="wave-speed-value">1.00</span>
          </div>
          <input type="range" id="wave-speed" min="0.2" max="2" step="0.05" value="1.0">
        </div>
      </div>
      
      <div class="control-group">
        <div class="slider-container">
          <div class="slider-header">
            <label for="damping">Damping</label>
            <span class="slider-value" id="damping-value">0.20</span>
          </div>
          <input type="range" id="damping" min="0" max="1" step="0.01" value="0.2">
        </div>
      </div>
      
      <div class="control-group">
        <div class="slider-container">
          <div class="slider-header">
            <label for="ripple-amplitude">Ripple Amplitude</label>
            <span class="slider-value" id="ripple-amplitude-value">40</span>
          </div>
          <input type="range" id="ripple-amplitude" min="5" max="80" step="1" value="40">
        </div>
      </div>
      
      <div class="control-group">
        <div class="slider-container">
          <div class="slider-header">
            <label for="ripple-size">Ripple Size</label>
            <span class="slider-value" id="ripple-size-value">1.0</span>
          </div>
          <input type="range" id="ripple-size" min="0.3" max="3" step="0.1" value="1.0">
        </div>
      </div>
      
      <div class="control-group">
        <div class="slider-container">
          <div class="slider-header">
            <label for="ambient-frequency">Ambient Wave Frequency</label>
            <span class="slider-value" id="ambient-frequency-value">0.3</span>
          </div>
          <input type="range" id="ambient-frequency" min="0" max="1" step="0.05" value="0.3">
        </div>
      </div>
      
      <div class="control-group">
        <div class="slider-container">
          <div class="slider-header">
            <label for="ambient-strength">Ambient Wave Strength</label>
            <span class="slider-value" id="ambient-strength-value">2.0</span>
          </div>
          <input type="range" id="ambient-strength" min="0" max="5" step="0.1" value="2.0">
        </div>
      </div>
    </div>
    
    <div id="loading-panel" class="visible">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Environment Map</div>
      <div class="loading-subtext">Please wait...</div>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
